baseURL = "https://kanekalla.github.io/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "Kishore R. Anekalla"
theme = "hugo-coder"
copyright = "© 2024 Kishore R. Anekalla"
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
paginate = 10
paginatePath = "page"

# Build settings
[build]
  writeStats = false

# Output formats
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]

[params]
  author = "Kishore R. Anekalla"
  description = "Bioinformatics | Computational Bio | Machine Learning | Data Science"
  keywords = ["computational biology", "data science", "machine learning", "bioinformatics", "research", "statistics"]
  info = "Bioinformatics | Computational Bio | Machine Learning | Data Science"
  
  # Social links
  [[params.social]]
    name = "Github"
    icon = "fab fa-github"
    url = "https://github.com/kanekalla/"
    weight = 1
  
  [[params.social]]
    name = "Google Scholar"
    icon = "fas fa-graduation-cap"
    url = "https://scholar.google.com/citations?user=Aux_e5sAAAAJ&hl=en"
    weight = 2
  
  [[params.social]]
    name = "Twitter"
    icon = "fab fa-twitter"
    url = "https://twitter.com/kishoreanekalla/"
    weight = 3
  
  [[params.social]]
    name = "LinkedIn"
    icon = "fab fa-linkedin"
    url = "http://linkedin.com/in/kishore-reddy-anekalla-9b4b8121"
    weight = 4
  
  [[params.social]]
    name = "Medium"
    icon = "fab fa-medium"
    url = "https://medium.com/@kishorereddyanekalla"
    weight = 5

  # Theme customization
  hideCredentials = false
  hideCopyright = false
  
  # Enable syntax highlighting
  highlight = true
  highlightStyle = "github-dark"
  
  # Enable math rendering (KaTeX)
  math = true
  
  # Enable code folding
  codeFolding = true

# Markup configuration
[markup]
  [markup.highlight]
    style = "github-dark"
    lineNos = true
    lineNumbersInTable = false
    noClasses = false
    codeFences = true
    guessSyntax = true
  
  [markup.goldmark]
    renderer = true
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = false
      xHTML = false
  
  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true
  
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
    ordered = false

# Menu configuration
[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 1
  
  [[menu.main]]
    identifier = "cv"
    name = "CV"
    url = "/cv/cv_kra.pdf"
    weight = 2
  
  [[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    weight = 3
  
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 4
  
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 5

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# Image processing
[imaging]
  quality = 85
  anchor = "smart"
  resampleFilter = "lanczos"
  hint = "photo"

